name: Build pinned Camellia Remote Web client
description: Build the locked Camellia Remote Web revision from a repository owned by the current account

inputs:
  repository-map:
    description: Complete reviewed Remote logical repository map
    required: true

outputs:
  revision:
    description: Immutable Camellia Remote commit used for this build
    value: ${{ steps.config.outputs.revision }}

runs:
  using: composite
  steps:
    - name: Resolve locked source
      id: config
      shell: bash
      env:
        REMOTE_REPOSITORY_MAP: ${{ inputs.repository-map }}
      run: |
        set -euo pipefail
        jq -e '
          type == "object" and
          keys == [
            "remote-client",
            "remote-management",
            "remote-protocol",
            "remote-server"
          ] and
          all(.[];
            type == "string" and
            length >= 1 and length <= 100 and
            test("^[A-Za-z0-9._-]+$")
          )
        ' <<< "$REMOTE_REPOSITORY_MAP" >/dev/null
        repository_name="$(jq -r '."remote-client"' <<< "$REMOTE_REPOSITORY_MAP")"
        management_name="$(jq -r '."remote-management"' <<< "$REMOTE_REPOSITORY_MAP")"
        current_name="${GITHUB_REPOSITORY#*/}"
        [[ "${management_name,,}" == "${current_name,,}" ]]
        [[ "${repository_name,,}" != "${management_name,,}" ]]
        revision="$("$GITHUB_WORKSPACE/scripts/web_client_revision.sh")"
        echo "repository=${GITHUB_REPOSITORY_OWNER}/${repository_name}" >> "$GITHUB_OUTPUT"
        echo "revision=$revision" >> "$GITHUB_OUTPUT"

    - name: Verify locked Camellia Remote source policy
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REPOSITORY: ${{ steps.config.outputs.repository }}
        REVISION: ${{ steps.config.outputs.revision }}
      run: |
        default_branch="$(gh api "repos/$REPOSITORY" --jq .default_branch)"
        default_revision="$(gh api "repos/$REPOSITORY/commits/$default_branch" --jq .sha)"
        comparison_status="$(
          gh api "repos/$REPOSITORY/compare/${REVISION}...${default_revision}" \
            --jq .status
        )"
        if [[ "$comparison_status" != "ahead" && "$comparison_status" != "identical" ]]; then
          echo "Camellia Remote revision $REVISION is not reachable from $default_branch" >&2
          exit 1
        fi

        runs_json="$(
          gh api -X GET "repos/$REPOSITORY/actions/runs" \
            -f head_sha="$REVISION" \
            -f event=push \
            -f status=success \
            -f per_page=100
        )"
        verified_run=""
        while IFS= read -r run_id; do
          jobs_json="$(
            gh api -X GET "repos/$REPOSITORY/actions/runs/$run_id/jobs" \
              -f per_page=100
          )"
          if [[ "$(
            jq -r '[.jobs[] | select(.name == "CI / Required" and .conclusion == "success")] | length' \
              <<< "$jobs_json"
          )" == "1" ]]; then
            verified_run="$run_id"
            break
          fi
        done < <(jq -r '.workflow_runs | sort_by(.run_number) | reverse[] | .id' <<< "$runs_json")

        if [[ -z "$verified_run" ]]; then
          echo "Camellia Remote revision $REVISION has no successful push CI / Required check" >&2
          exit 1
        fi
        echo "Verified Camellia Remote push CI run $verified_run for $REVISION"

    - name: Restore compiled Web runtime
      id: runtime-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: static/web_client
        key: >-
          camellia-remote-web-${{ runner.os }}-${{ steps.config.outputs.revision }}-${{
          hashFiles('sync_web_client.sh', 'scripts/web_client_toolchains.sh', '.github/actions/build-web-client/action.yml') }}

    - name: Checkout locked Camellia Remote source
      if: steps.runtime-cache.outputs.cache-hit != 'true'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: ${{ steps.config.outputs.repository }}
        ref: ${{ steps.config.outputs.revision }}
        path: .web-client-source
        persist-credentials: false
        submodules: recursive

    - name: Verify checked-out source
      if: steps.runtime-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        EXPECTED_REVISION: ${{ steps.config.outputs.revision }}
      run: |
        actual_revision="$(git -C "$GITHUB_WORKSPACE/.web-client-source" rev-parse HEAD)"
        if [[ "$actual_revision" != "$EXPECTED_REVISION" ]]; then
          echo "Camellia Remote checkout mismatch: expected $EXPECTED_REVISION, got $actual_revision" >&2
          exit 1
        fi

    - name: Read source toolchain contract
      id: toolchains
      if: steps.runtime-cache.outputs.cache-hit != 'true'
      shell: bash
      run: bash "$GITHUB_WORKSPACE/scripts/web_client_toolchains.sh" "$GITHUB_WORKSPACE/.web-client-source" >> "$GITHUB_OUTPUT"

    - name: Set up Flutter
      if: steps.runtime-cache.outputs.cache-hit != 'true'
      uses: ./.web-client-source/.github/actions/setup-flutter # zizmor: ignore[self-repository] Loaded from the separately checked, exact-SHA source after successful trusted push CI; not an action in this repository.
      with:
        channel: stable
        flutter-version: ${{ steps.toolchains.outputs.flutter-version }}
        cache: true

    - name: Set up Node.js
      if: steps.runtime-cache.outputs.cache-hit != 'true'
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ steps.toolchains.outputs.node-version }}
        cache: npm
        cache-dependency-path: .web-client-source/flutter/web/js/package-lock.json

    - name: Build and synchronize Web runtime
      if: steps.runtime-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        "$GITHUB_WORKSPACE/sync_web_client.sh" \
          --build-from "$GITHUB_WORKSPACE/.web-client-source"

    - name: Verify compiled Web runtime
      shell: bash
      env:
        EXPECTED_REVISION: ${{ steps.config.outputs.revision }}
      run: |
        revision_file="$GITHUB_WORKSPACE/static/web_client/.source_revision"
        if [[ ! -f "$revision_file" ]]; then
          echo "Compiled Web runtime is missing $revision_file" >&2
          exit 1
        fi
        revision_record="$(tr -d '\r\n' < "$revision_file")"
        if [[ "$revision_record" != "$EXPECTED_REVISION clean" ]]; then
          echo "Web runtime provenance mismatch: expected '$EXPECTED_REVISION clean', got '$revision_record'" >&2
          exit 1
        fi
        required_files=(
          flutter_bootstrap.js
          main.dart.js
          manifest.json
          canvaskit/canvaskit.wasm
          js/dist/web_bridge.js
          web_client_manifest.json
        )
        for required_file in "${required_files[@]}"; do
          if [[ ! -f "$GITHUB_WORKSPACE/static/web_client/$required_file" ]]; then
            echo "Compiled Web runtime is missing $required_file" >&2
            exit 1
          fi
        done
        shopt -s nullglob
        worker_matches=("$GITHUB_WORKSPACE"/static/web_client/js/dist/assets/video_worker-*.js)
        shopt -u nullglob
        if [[ ${#worker_matches[@]} -eq 0 ]]; then
          echo "Compiled Web runtime is missing video worker chunk in js/dist/assets/" >&2
          exit 1
        fi
        if grep -Eq '["'\'']/js/dist/assets/video_worker' "$GITHUB_WORKSPACE/static/web_client/js/dist/web_bridge.js"; then
          echo "Web bridge contains root-absolute video worker path /js/dist/assets/video_worker" >&2
          exit 1
        fi
        if grep -Eq 'Object\.assign\(\{\}\)\[' "$GITHUB_WORKSPACE/static/web_client/js/dist/web_bridge.js"; then
          echo "Web bridge contains empty Object.assign glob lookup for software decoders" >&2
          exit 1
        fi
        python3 -c '
import hashlib, json, os, sys
from pathlib import Path

root = Path(sys.argv[1])
expected_rev = sys.argv[2]
manifest_path = root / "web_client_manifest.json"
if not manifest_path.is_file():
    sys.exit("Missing web_client_manifest.json")
with manifest_path.open("r", encoding="utf-8") as f:
    manifest = json.load(f)

if manifest.get("schema_version") != 1:
    sys.exit("Invalid manifest schema_version")
actual_rev = manifest.get("source_revision")
if actual_rev != expected_rev:
    sys.exit(f"Manifest source revision mismatch: expected {expected_rev}, got {actual_rev}")

files = manifest.get("files", {})
if not files:
    sys.exit("Manifest has no files")

lines = []
for rel, spec in sorted(files.items()):
    fp = root / rel
    if not fp.is_file() or fp.is_symlink():
        sys.exit(f"Missing or invalid file declared in manifest: {rel}")
    data = fp.read_bytes()
    expected_size = spec["size"]
    if len(data) != expected_size:
        sys.exit(f"Size mismatch for {rel}")
    sha = hashlib.sha256(data).hexdigest()
    expected_sha = spec["sha256"]
    if sha.lower() != expected_sha.lower():
        sys.exit(f"Hash mismatch for {rel}")
    lines.append(f"{rel}:{expected_size}:{expected_sha}")

expected_root = hashlib.sha256("\n".join(lines).encode("utf-8")).hexdigest()
manifest_root = manifest.get("root_digest", "")
if expected_root.lower() != manifest_root.lower():
    sys.exit(f"Root digest mismatch: expected {expected_root}, got {manifest_root}")

for root_dir, _, filenames in os.walk(root):
    for fn in filenames:
        p = Path(root_dir) / fn
        rel_posix = p.relative_to(root).as_posix()
        if rel_posix in (".source_revision", "web_client_manifest.json"):
            continue
        if rel_posix not in files:
            sys.exit(f"Unmanifested file found in web client deployment: {rel_posix}")
' "$GITHUB_WORKSPACE/static/web_client" "$EXPECTED_REVISION"
        if [[ -n "$(find "$GITHUB_WORKSPACE/static/web_client" -type l -print -quit)" ]]; then
          echo "Compiled Web runtime must not contain symbolic links" >&2
          exit 1
        fi
