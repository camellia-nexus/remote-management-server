name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: remote-management-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  container:
    name: Build and publish container image
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    outputs:
      image_name: ${{ steps.meta.outputs.image_name }}
      image_digest: ${{ steps.build.outputs.digest }}
      version: ${{ steps.metadata.outputs.version }}
      tag: ${{ steps.metadata.outputs.tag }}
      web_revision: ${{ steps.meta.outputs.web_revision }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Extract metadata
        id: metadata
        run: python3 scripts/release_metadata.py --github-output

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure image metadata
        id: meta
        shell: bash
        run: |
          web_rev="$(bash scripts/web_client_revision.sh)"
          repo_owner_lower="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          image_name="ghcr.io/${repo_owner_lower}/remote-management-server"
          {
            echo "web_revision=${web_rev}"
            echo "image_name=${image_name}"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push multi-arch image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.metadata.outputs.version }}
            REVISION=${{ github.sha }}
            SOURCE_REPOSITORY_URL=${{ github.server_url }}/${{ github.repository }}
            WEB_REVISION=${{ steps.meta.outputs.web_revision }}
          tags: |
            ${{ steps.meta.outputs.image_name }}:latest
            ${{ steps.meta.outputs.image_name }}:${{ steps.metadata.outputs.version }}
            ${{ steps.meta.outputs.image_name }}:${{ steps.metadata.outputs.tag }}
            ${{ steps.meta.outputs.image_name }}:${{ github.sha }}

  release:
    name: Publish GitHub Release
    needs: container
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate release assets
        shell: bash
        env:
          VERSION: ${{ needs.container.outputs.version }}
          RELEASE_TAG: ${{ needs.container.outputs.tag }}
          SOURCE_SHA: ${{ github.sha }}
          WEB_REVISION: ${{ needs.container.outputs.web_revision }}
          IMAGE_NAME: ${{ needs.container.outputs.image_name }}
          IMAGE_DIGEST: ${{ needs.container.outputs.image_digest }}
        run: |
          mkdir -p release-assets
          jq -n \
            --arg version "$VERSION" \
            --arg tag "$RELEASE_TAG" \
            --arg source_commit "$SOURCE_SHA" \
            --arg remote_web_commit "$WEB_REVISION" \
            --arg image_name "$IMAGE_NAME" \
            --arg image_digest "$IMAGE_DIGEST" \
            '{
              version: $version,
              tag: $tag,
              source_commit: $source_commit,
              remote_web_commit: $remote_web_commit,
              image_name: $image_name,
              image_digest: $image_digest
            }' > release-assets/release-metadata.json

          cat <<EOF > release-assets/RELEASE-NOTES.md
          # Camellia Remote Management Server $VERSION

          - Version: \`$VERSION\`
          - Tag: \`$RELEASE_TAG\`
          - Source commit: \`$SOURCE_SHA\`
          - Web client revision: \`$WEB_REVISION\`
          - Multi-arch container image: \`$IMAGE_NAME:$VERSION\`
          - Image digest: \`$IMAGE_DIGEST\`
          EOF

          (
            cd release-assets
            sha256sum release-metadata.json RELEASE-NOTES.md > SHA256SUMS
          )

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_type == 'tag' && github.ref_name || needs.container.outputs.tag }}
          VERSION: ${{ needs.container.outputs.version }}
        run: |
          gh release create "$TAG_NAME" \
            --title "Camellia Remote Management Server $VERSION" \
            --notes-file release-assets/RELEASE-NOTES.md \
            release-assets/release-metadata.json \
            release-assets/RELEASE-NOTES.md \
            release-assets/SHA256SUMS || \
          gh release upload "$TAG_NAME" \
            release-assets/release-metadata.json \
            release-assets/RELEASE-NOTES.md \
            release-assets/SHA256SUMS --clobber
