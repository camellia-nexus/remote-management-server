name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'codex/**'
      - 'gemini/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: remote-management-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Python and Django quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine@sha256:898c60cb390d1085bc97bdd6a1ae968757421df394b071848b52b1c09c89d6a5
        env:
          POSTGRES_DB: camellia_remote_ci
          POSTGRES_USER: camellia_remote_ci
          POSTGRES_PASSWORD: ci-postgres-password
          POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale-provider=builtin --builtin-locale=C.UTF-8
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U camellia_remote_ci -d camellia_remote_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CAMELLIA_REMOTE_DEBUG: "true"
      CAMELLIA_REMOTE_SECRET_KEY: ci-only-secret-key
      CAMELLIA_REMOTE_ALLOWED_HOSTS: "127.0.0.1,localhost"
      CAMELLIA_REMOTE_CSRF_TRUSTED_ORIGINS: "http://127.0.0.1:21114"
      CAMELLIA_REMOTE_DATABASE_URL: postgres://camellia_remote_ci:ci-postgres-password@127.0.0.1:5432/camellia_remote_ci
      CAMELLIA_REMOTE_DATABASE_SSLMODE: disable
      CAMELLIA_REMOTE_DEVICE_VERIFICATION_TOKEN: ci-device-verification-token-with-sufficient-length
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          python-version: "3.15.1"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Static analysis
        run: |
          uv run python -m compileall api webui2 camellia_remote_management scripts
          uv run ruff check api webui2 camellia_remote_management scripts

      - name: Django checks
        run: |
          uv run python manage.py check
          uv run python manage.py makemigrations --check --dry-run

      - name: Tests
        run: uv run pytest api webui2 -q

  quality_sqlite:
    name: SQLite debug equivalence
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CAMELLIA_REMOTE_DEBUG: "true"
      CAMELLIA_REMOTE_SECRET_KEY: ci-only-sqlite-secret-key
      CAMELLIA_REMOTE_ALLOWED_HOSTS: "127.0.0.1,localhost"
      CAMELLIA_REMOTE_CSRF_TRUSTED_ORIGINS: "http://127.0.0.1:21114"
      CAMELLIA_REMOTE_DEVICE_VERIFICATION_TOKEN: ci-device-verification-token-with-sufficient-length
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          python-version: "3.15.1"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Tests (SQLite)
        run: uv run pytest api webui2 -q

  publish:
    name: Publish to GHCR
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    needs: [quality, quality_sqlite]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Extract metadata
        id: meta
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -n 1)"
          web_revision="$(tr -d '\r\n' < web-client.lock)"
          image="ghcr.io/${{ github.repository_owner }}/remote-management-server"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "web_revision=${web_revision}" >> "$GITHUB_OUTPUT"
          echo "image=${image}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
            SOURCE_REPOSITORY_URL=${{ github.server_url }}/${{ github.repository }}
            WEB_REVISION=${{ steps.meta.outputs.web_revision }}
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:${{ github.sha }}

  required:
    name: CI / Required
    if: always()
    needs:
      - quality
      - quality_sqlite
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Enforce required results
        shell: bash
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          SQLITE_RESULT: ${{ needs.quality_sqlite.result }}
        run: |
          [[ "$QUALITY_RESULT" == success ]] || { echo "Quality must succeed, got: $QUALITY_RESULT" >&2; exit 1; }
          [[ "$SQLITE_RESULT" == success ]] || { echo "SQLite quality must succeed, got: $SQLITE_RESULT" >&2; exit 1; }
